appId: com.turbolaunch.ehrlite
productName: EHR Lite
copyright: Copyright 2025

directories:
  output: dist
  buildResources: electron/assets

files:
  - electron/main.js
  - electron/preload.js
  - node_modules/**

extraResources:
  - from: backend
    to: app/backend
    filter:
      - "**/*"
      - "!node_modules/.cache"
  - from: frontend/.next/standalone
    to: app/frontend/.next/standalone
  - from: frontend/.next/static
    to: app/frontend/.next/standalone/.next/static
  - from: frontend/public
    to: app/frontend/.next/standalone/public
  - from: node-win
    to: node

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EHR Lite
